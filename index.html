<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Surprise</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <div class="container">

        <div class="envelope-container">

            <img
                src="amplop1.PNG"
                id="envelope"
                class="envelope"
                alt="amplop"
            >

            <!-- Area klik seal -->
            <div id="seal"></div>

            <div id="typedMessage" class="typed-message"></div>

        </div>

        <div id="letterText" class="letter-text">

            <h2>Happy Birthday ❤️</h2>

            <p>
                Hari ini adalah hari yang spesial,
                dan kamu adalah alasan mengapa hari ini terasa lebih indah.
            </p>

        </div>

    </div>
    </div>


<!-- ======================
     GIFT SCENE
====================== -->

<div id="giftScene">

    <img id="giftBox"
         src="closedgift.PNG"
         alt="gift">

    <img class="gift-item bag" src="bag.PNG">
    <img class="gift-item balloon" src="ballon.PNG">
    <img class="gift-item bear" src="boneka.PNG">
    <img class="gift-item cupcake" src="cupcake.PNG">
    <img class="gift-item perfume" src="parfume.PNG">
    <img class="gift-item iphone" src="iphone.PNG">
    <img class="gift-item ring" src="ring.PNG">
    <img class="gift-item makeup" src="makeup.PNG">
    <img class="gift-item dog1" src="doggy1.PNG">
    <img class="gift-item dog2" src="doggy2.PNG">
    <img class="gift-item heels" src="heels.PNG">
    <img class="gift-item jewelry" src="jewelry.PNG">
    <img class="gift-item lipstick" src="lipstick.PNG">
    <img class="gift-item plane" src="plane.PNG">
    <img class="gift-item tea" src="tea.PNG">
    <img class="gift-item mobil" src="mobil.PNG">
</div>


<div id="questionBox">

    <h2>
        Ready for the next surprise? 
    </h2>

    <div class="question-buttons">

        <button id="yesBtn">
            IYA
        </button>

        <button id="noBtn">
            IYE
        </button>

    </div>

</div>

    <script src="script.js"></script>

</body>
</html>
